sectionLabel: 'Funcionalidades'
items:
  - title: 'Vendé tickets desde tu propia plataforma'
    description: 'Cada evento tiene su link único. Tu público elige el tipo de ticket, paga con cualquier medio de pago y recibe su ticket con QR al instante.'
    bullets:
      - 'Múltiples tipos de tickets por evento'
      - 'Tickets gratis, pagos o de invitación'
      - 'Cobro directo a tu cuenta de Mercado Pago'
    imageAlt: 'Página de compra de tickets para un evento'
    reversed: false
    phoneFrame: false
  - title: 'Todos tus eventos en un solo lugar'
    description: 'Organizá tus eventos por carpeta, creá eventos en minutos y tené siempre a mano la agenda completa.'
    bullets:
      - 'Organizá tus eventos con carpetas, como quieras.'
      - 'Creación rápida con fecha, lugar y tipos de entrada'
      - 'Historial completo de eventos pasados'
    imageAlt: 'Menú de la ticketera con todos los eventos desplegados'
    reversed: true
    phoneFrame: true
  - title: 'Conocé a cada persona que participa de tu evento'
    description: 'Nombre y apellido, fecha de nacimiento, mail. Cada ticket vendido alimenta tu base de datos. Exportala a Excel cuando quieras.'
    bullets:
      - 'Filtros por nombre y apellido, mail, fecha de nacimiento'
      - 'Exportación a Excel con un click'
      - 'Datos reales de cada asistente'
      - 'Contactá fácil y rápidamente a tu público por WhatsApp, Instagram o mail.'
    imageAlt: 'Base de datos de asistentes con filtros y exportación'
    reversed: false
    phoneFrame: false
  - title: 'Escaneá desde cualquier celular'
    description: 'Cada ticket tiene un QR único. Tu equipo de puerta (acceso) lo escanea con la cámara del teléfono, sin app extra, sin hardware especial.'
    bullets:
      - 'QR único por ticket, imposible de duplicar'
      - 'Funciona con cualquier celular'
      - 'Validación en tiempo real'
    imageAlt: 'Ticket digital con código QR para escaneo en puerta'
    reversed: true
    phoneFrame: true
